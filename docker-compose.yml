services:
  postgres:
    image: postgres:15-alpine
    container_name: coffee-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DB}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - app-network
  nestjs-app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nestjs-app
    ports: []
    depends_on:
      - postgres
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_DB: ${DB_DB}
    env_file:
      - .env
    networks:
      - app-network
    restart: always

  nginx:
    image: nginx:latest
    container_name: reverse_proxy
    volumes:
      - ./backend/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "5500:5500"
    depends_on:
      - nestjs-app
    networks:
      - app-network
    restart: always

volumes:
  postgres_data:

networks:
  app-network:
    driver: bridge
